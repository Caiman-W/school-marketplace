<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Template Listing</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <!-- JSZip for creating a ZIP in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<header class="container header">
  <div>
    <h1>Template Listing</h1>
    <p class="muted">Drag images → auto-convert → download ZIP + copy JSON.</p>
  </div>
  <div class="header-actions">
    <a class="btn btn-secondary" href="index.html">Back</a>
  </div>
</header>

<main class="container">

  <section class="card">
    <div class="control-row">
      <div class="control" style="flex:2;">
        <label>Title</label>
        <input id="title" placeholder="Dell Chromebook 3100 (Lot of 30)" />
      </div>

      <div class="control">
        <label>ID (auto-generated)</label>
        <input id="id" readonly />
      </div>
    </div>

    <div class="control-row">
      <div class="control">
        <label>Category</label>
        <input id="category" placeholder="Chromebooks, Switches, APs" />
      </div>

      <div class="control">
        <label>Quantity</label>
        <input id="qty" type="number" min="0" value="0" />
      </div>

      <div class="control">
        <label>Condition</label>
        <select id="condition">
          <option>Used</option>
          <option>New</option>
          <option>Fair</option>
          <option>Parts</option>
        </select>
      </div>

      <div class="control">
        <label>Status</label>
        <select id="status">
          <option>Available</option>
          <option>Pending</option>
          <option>Sold</option>
        </select>
      </div>
    </div>

    <div class="control-row">
      <div class="control">
        <label>Price</label>
        <input id="price" type="number" min="0" value="0" />
      </div>

      <div class="control">
        <label>Price note</label>
        <input id="priceNote" placeholder="each (OBO), total, includes chargers" />
      </div>

      <div class="control">
        <label>Location</label>
        <input id="location" placeholder="Columbia, SC" />
      </div>

      <div class="control">
        <label>Date posted</label>
        <input id="datePosted" type="date" />
      </div>
    </div>

    <div class="control-row">
      <div class="control" style="flex:2; min-width:260px;">
        <label>Description</label>
        <textarea id="description" rows="5"
          placeholder="Condition details, accessories, pickup notes…"></textarea>
      </div>
    </div>

    <hr class="soft-hr">

    <div class="control-row">
      <div class="control" style="flex:2; min-width:260px;">
        <label>Images (drag & drop)</label>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Drop images here">
          <div class="dropzone-top">
            <div>
              <b>Drop images here</b>
              <div class="muted small">Auto-converts to .webp and resizes (max width 1400px).</div>
            </div>
            <button id="pickFiles" class="btn btn-secondary" type="button">Choose files</button>
          </div>
          <input id="fileInput" type="file" accept="image/*" multiple hidden />
          <div id="thumbs" class="thumbs"></div>
        </div>
        <div class="muted small" id="imgStatus" style="margin-top:10px;"></div>
      </div>
    </div>

    <div class="control-row">
      <div class="control">
        <label>Image settings</label>
        <div class="range-row">
          <div class="range-item">
            <span class="muted small">Max width</span>
            <input id="maxWidth" type="number" min="600" step="100" value="1400" />
          </div>
          <div class="range-item">
            <span class="muted small">Quality (0–1)</span>
            <input id="quality" type="number" min="0.3" max="1" step="0.05" value="0.82" />
          </div>
          <div class="range-item">
            <span class="muted small">Format</span>
            <select id="format">
              <option value="image/webp" selected>webp</option>
              <option value="image/jpeg">jpeg</option>
              <option value="image/png">png</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="control-row">
      <button id="generate" class="btn" type="button">Generate JSON</button>
      <button id="copy" class="btn btn-secondary" type="button">Copy JSON</button>
      <button id="downloadZip" class="btn btn-secondary" type="button">Download ZIP (images + json)</button>
    </div>
  </section>

  <section class="card" style="margin-top:14px;">
    <h2 style="margin:0 0 10px;">JSON Output (paste into <code>listings.json</code>)</h2>
    <pre id="output"
      style="white-space:pre-wrap;overflow:auto;margin:0;
             background:#ffffff;border:1px solid var(--border);
             border-radius:12px;padding:12px;"></pre>
  </section>

</main>

<script src="template.js"></script>
</body>
</html>
