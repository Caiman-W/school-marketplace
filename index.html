<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>School Equipment Marketplace</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="container header">
  <div>
    <h1>School Equipment Marketplace</h1>
    <p class="muted">Internal listings for surplus and available school equipment.</p>
  </div>

  <div class="header-actions">
    <button id="templateBtn" class="btn btn-secondary" type="button">Template listing</button>
  </div>
</header>

<main class="container">

  <section class="controls card">
    <div class="control-row">
      <div class="control" style="flex:2; min-width:240px;">
        <label>Search</label>
        <input id="q" type="search" placeholder="Search listings…" />
      </div>

      <div class="control">
        <label>Category</label>
        <select id="category">
          <option value="">All</option>
        </select>
      </div>

      <div class="control">
        <label>Location</label>
        <select id="location">
          <option value="">All</option>
        </select>
      </div>

      <div class="control">
        <label>Sort</label>
        <select id="sort">
          <option value="newest">Newest</option>
          <option value="price_asc">Price ↑</option>
          <option value="price_desc">Price ↓</option>
          <option value="qty_desc">Quantity ↓</option>
        </select>
      </div>
    </div>

    <div class="control-row">
      <button id="reset" class="btn btn-secondary" type="button">Reset</button>
      <div class="muted" id="count"></div>
    </div>
  </section>

  <section id="grid" class="grid"></section>

</main>

<!-- Hidden Admin Link -->
<a class="stealth-admin" href="admin.html" aria-label="Admin">•</a>

<dialog id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-top">
      <h2 id="modalTitle"></h2>
      <button id="closeModal" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
