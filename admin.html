<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<main class="container">
  <h1>Admin</h1>

  <div class="card">
    <label>Title</label><input id="title">
    <label>Category</label><input id="category">
    <label>Quantity</label><input id="qty" type="number">
    <label>Condition</label><input id="condition">
    <label>Price</label><input id="price" type="number">
    <label>Location</label><input id="location">
    <label>Description</label><textarea id="desc"></textarea>
    <button class="btn" onclick="generate()">Generate JSON</button>
  </div>

  <pre id="out" class="card"></pre>
</main>

<script src="admin.js"></script>
</body>
</html>
